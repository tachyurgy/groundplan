[project]
name = "gp-pipeline"
version = "0.1.0"
description = "Groundplan document pipeline: synthetic tax documents, extraction, entity resolution, reconciliation, eval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "reportlab>=4.2",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "numpy>=2.0",
    "pydantic>=2.8",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "boto3>=1.35"]

[project.scripts]
gp-pipeline = "gp_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
