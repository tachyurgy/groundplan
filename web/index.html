<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Groundplan: real-estate planning for financial advisors. Reconcile tax returns and statements, then compare hold, sell and 1031 paths with every number traceable to its source." />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Groundplan</title>
    <script>
      // Resolve the theme before first paint (no flash): explicit choice wins, else the OS setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('gp.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Groundplan needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
