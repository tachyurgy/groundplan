[project]
name = "groundplan"
version = "0.1.0"
description = "Groundplan backend: deterministic real-estate planning engine, FastAPI API, Postgres persistence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "boto3>=1.35"]

[project.scripts]
groundplan-seed = "scripts.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundplan", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:groundplan.*"]

[tool.uv]
python-preference = "managed"
