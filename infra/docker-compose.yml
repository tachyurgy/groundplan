# Local container run (optional; the default dev loop is `make db && make api` against local Postgres).
#   docker compose -f infra/docker-compose.yml up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: groundplan
      POSTGRES_USER: groundplan
      POSTGRES_PASSWORD: groundplan-local-only   # local throwaway; real deployments read Secrets Manager
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundplan -d groundplan"]
      interval: 5s
      retries: 10

  migrate:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    environment:
      GP_DATABASE_URL: postgresql+psycopg://groundplan:groundplan-local-only@postgres:5432/groundplan
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    depends_on: {postgres: {condition: service_healthy}}

  api:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    environment:
      GP_DATABASE_URL: postgresql+psycopg://groundplan:groundplan-local-only@postgres:5432/groundplan
      GP_CORS_ORIGINS: '["http://localhost:5173"]'
      GP_LLM_PROVIDER: ""          # template narrative; no paid API by default
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata: {}
